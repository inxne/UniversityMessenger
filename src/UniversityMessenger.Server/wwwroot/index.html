<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<title>University Messenger — проверка реалтайма</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/microsoft-signalr/8.0.7/signalr.min.js"></script>
<style>
  body { font-family: Segoe UI, sans-serif; margin: 2rem; }
  #log { border: 1px solid #ccc; height: 300px; overflow-y: auto; padding: .5rem; }
  input { width: 480px; padding: .4rem; margin: .2rem 0; }
  button { padding: .4rem 1rem; margin: .2rem; }
</style>
</head>
<body>
<h2>Проверка реалтайма: два окна</h2>
<p>
1. Получи токен через Swagger: POST /api/auth/login.<br />
2. Вставь токен и Id чата, нажми «Подключиться».<br />
3. Открой вторую страницу в другом окне под вторым пользователем.<br />
4. Пиши из любого окна: сообщения появляются в обоих мгновенно.
</p>
<input id="token" placeholder="JWT-токен" />
<input id="chatId" placeholder="Id чата (guid)" />
<button id="join">Подключиться и подписаться</button>
<br />
<input id="text" placeholder="Текст сообщения" />
<button id="send">Отправить</button>
<div id="log"></div>
<script>
let connection = null;
const log = document.getElementById('log');
function add(line) {
  const div = document.createElement('div');
  div.textContent = line;
  log.appendChild(div);
  log.scrollTop = log.scrollHeight;
}

document.getElementById('join').onclick = async () => {
  const token = document.getElementById('token').value.trim();
  const chatId = document.getElementById('chatId').value.trim();
  connection = new signalR.HubConnectionBuilder()
    .withUrl('/hubs/chat', { accessTokenFactory: () => token })
    .withAutomaticReconnect()
    .build();
  connection.on('MessageReceived', m => add(m.senderName + ': ' + m.ciphertext));
  connection.on('Error', e => add('Ошибка: ' + e));
  connection.on('Info', i => add('Инфо: ' + i));
  try {
    await connection.start();
    add('Соединение установлено.');
    await connection.invoke('JoinChat', chatId);
  } catch (e) {
    add('Не удалось подключиться: ' + e);
  }
};

document.getElementById('send').onclick = async () => {
  const chatId = document.getElementById('chatId').value.trim();
  const text = document.getElementById('text').value.trim();
  if (!connection || !text) return;
  try {
    await connection.invoke('SendMessage', chatId, text);
    document.getElementById('text').value = '';
  } catch (e) {
    add('Не удалось отправить: ' + e);
  }
};
</script>
</body>
</html>
